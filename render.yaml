services:
  - type: web
    name: newsintel-api
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FETCH_INTERVAL_MINUTES
        value: "60"
      - key: PYTHON_VERSION
        value: "3.11.9"
    disk:
      name: newsintel-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
